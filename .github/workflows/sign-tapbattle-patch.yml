name: Sign Tap Battle Patch

on:
  workflow_dispatch:
    inputs:
      patch_version:
        description: Patch version number already staged under tapbattle-patches/vN
        required: true
        type: string
  push:
    branches:
      - 'release/patch-*'
    paths:
      - 'tapbattle-patches/sign-request'

permissions:
  contents: write

concurrency:
  group: tapbattle-production-signing
  cancel-in-progress: false

jobs:
  sign:
    name: Sign immutable patch manifest
    runs-on: ubuntu-latest
    environment: tapbattle-release
    timeout-minutes: 10
    env:
      PATCH_VERSION_INPUT: ${{ inputs.patch_version }}
      SIGNING_KEY_ID: ${{ vars.TAPBATTLE_SIGNING_KEY_ID || 'release-2026-01' }}
      RELEASE_PRIVATE_KEY_B64: ${{ secrets.TAPBATTLE_RELEASE_PRIVATE_KEY_B64 }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve requested patch version
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$PATCH_VERSION_INPUT"
          else
            VERSION="$(tr -d '[:space:]' < tapbattle-patches/sign-request)"
          fi

          case "$VERSION" in
            ''|*[!0-9]*)
              echo "Invalid patch version: $VERSION"
              exit 1
              ;;
          esac

          test "$GITHUB_REF_NAME" = "release/patch-$VERSION" || {
            echo "Branch must be release/patch-$VERSION, got $GITHUB_REF_NAME"
            exit 1
          }

          echo "PATCH_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_PRIVATE_KEY_B64"
          test -n "$SIGNING_KEY_ID"
          test -f "tapbattle-patches/trusted-keys.properties"
          test -f "tapbattle-patches/trusted-keys.sig"
          test -f "tapbattle-patches/v$PATCH_VERSION/manifest.properties"

      - name: Stamp signing metadata and sync latest manifest
        shell: python
        run: |
          from pathlib import Path
          import os

          version = os.environ["PATCH_VERSION"]
          key_id = os.environ["SIGNING_KEY_ID"]
          archived = Path(f"tapbattle-patches/v{version}/manifest.properties")
          text = archived.read_text(encoding="utf-8")
          lines = [line for line in text.splitlines()
                   if not line.startswith("signing.keyId=")
                   and not line.startswith("signing.algorithm=")]
          lines += ["", f"signing.keyId={key_id}", "signing.algorithm=SHA256withRSA"]
          final = "\n".join(lines).rstrip() + "\n"
          archived.write_text(final, encoding="utf-8", newline="\n")
          Path("tapbattle-patches/manifest.properties").write_text(final, encoding="utf-8", newline="\n")

      - name: Validate payload and trusted release key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PRIVATE_KEY="$(mktemp)"
          PUBLIC_DER="$(mktemp)"
          trap 'rm -f "$PRIVATE_KEY" "$PUBLIC_DER"' EXIT

          if printf '%s' "$RELEASE_PRIVATE_KEY_B64" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            printf '%s\n' "$RELEASE_PRIVATE_KEY_B64" | tr -d '\r' > "$PRIVATE_KEY"
          else
            printf '%s' "$RELEASE_PRIVATE_KEY_B64" | tr -d '[:space:]' | base64 --decode > "$PRIVATE_KEY"
          fi
          openssl pkey -in "$PRIVATE_KEY" -pubout -outform DER -out "$PUBLIC_DER"

          EXPECTED_PUBLIC="$(python3 - <<'PY'
          import os
          from pathlib import Path
          key_id = os.environ["SIGNING_KEY_ID"]
          props = {}
          for raw in Path("tapbattle-patches/trusted-keys.properties").read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if line and not line.startswith("#") and "=" in line:
                  k, v = line.split("=", 1)
                  props[k.strip()] = v.strip()
          count = int(props["key.count"])
          for i in range(count):
              p = f"key.{i}."
              if props.get(p + "id") == key_id:
                  assert props.get(p + "status") == "trusted", "signing key is not trusted"
                  print(props[p + "publicKey"])
                  break
          else:
              raise SystemExit("signing key ID is missing from trusted-keys.properties")
          PY
          )"
          ACTUAL_PUBLIC="$(base64 -w0 "$PUBLIC_DER")"
          test "$EXPECTED_PUBLIC" = "$ACTUAL_PUBLIC" || {
            echo "GitHub signing secret does not match the trusted public key."
            exit 1
          }

          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path

          root = Path("tapbattle-patches")
          version = int(os.environ["PATCH_VERSION"])
          latest = root / "manifest.properties"
          archived = root / f"v{version}" / "manifest.properties"
          assert latest.read_bytes() == archived.read_bytes()

          props = {}
          for raw in latest.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if line and not line.startswith("#") and "=" in line:
                  k, v = line.split("=", 1)
                  props[k.strip()] = v.strip()

          assert int(props["patch.version"]) == version
          assert props["signing.keyId"] == os.environ["SIGNING_KEY_ID"]
          assert props["signing.algorithm"] == "SHA256withRSA"
          total = 0
          for i in range(int(props["file.count"])):
              p = f"file.{i}."
              source = props[p + "source"]
              assert source.startswith(f"v{version}/")
              data = (root / source).read_bytes()
              total += len(data)
              assert int(props[p + "size"]) == len(data)
              assert props[p + "sha256"].lower() == hashlib.sha256(data).hexdigest()
          if "patch.totalSize" in props:
              assert int(props["patch.totalSize"]) == total
          PY

      - name: Sign exact manifest bytes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PRIVATE_KEY="$(mktemp)"
          SIG_BIN="$(mktemp)"
          PUBLIC_PEM="$(mktemp)"
          trap 'rm -f "$PRIVATE_KEY" "$SIG_BIN" "$PUBLIC_PEM"' EXIT

          if printf '%s' "$RELEASE_PRIVATE_KEY_B64" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            printf '%s\n' "$RELEASE_PRIVATE_KEY_B64" | tr -d '\r' > "$PRIVATE_KEY"
          else
            printf '%s' "$RELEASE_PRIVATE_KEY_B64" | tr -d '[:space:]' | base64 --decode > "$PRIVATE_KEY"
          fi
          openssl pkey -in "$PRIVATE_KEY" -pubout -out "$PUBLIC_PEM"

          MANIFEST="tapbattle-patches/v$PATCH_VERSION/manifest.properties"
          openssl dgst -sha256 -sign "$PRIVATE_KEY" -out "$SIG_BIN" "$MANIFEST"
          base64 -w0 "$SIG_BIN" > "tapbattle-patches/v$PATCH_VERSION/manifest.sig"
          printf '\n' >> "tapbattle-patches/v$PATCH_VERSION/manifest.sig"
          cp "tapbattle-patches/v$PATCH_VERSION/manifest.sig" tapbattle-patches/manifest.sig

          openssl dgst -sha256 -verify "$PUBLIC_PEM" -signature "$SIG_BIN" "$MANIFEST"

      - name: Commit signed release candidate to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "tapbattle-release-bot"
          git config user.email "tapbattle-release-bot@users.noreply.github.com"
          git add \
            tapbattle-patches/manifest.properties \
            tapbattle-patches/manifest.sig \
            "tapbattle-patches/v$PATCH_VERSION/manifest.properties" \
            "tapbattle-patches/v$PATCH_VERSION/manifest.sig"
          git diff --cached --quiet && { echo "Nothing to sign."; exit 1; }
          git commit -m "Sign Tap Battle Patch $PATCH_VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"
